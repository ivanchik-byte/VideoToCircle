services:
  bot:
    build: .
    container_name: video_to_circle_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - temp_data:/app/temp

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram_bot_api_server
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_api_data:/var/lib/telegram-bot-api
    profiles:
      - local-api

volumes:
  app_data:
  temp_data:
  telegram_api_data:
